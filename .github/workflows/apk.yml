name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes
        run: gradle testDebugUnitTest

      - name: Assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/corrida-verde.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/corrida-verde.p12" >> "$GITHUB_ENV"

      - name: APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk corrida-verde.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" corrida-verde.apk \
            --title "Corrida Verde 1.${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message || 'Build manual' }}"
