name: APK

on:
  push:
    # main: versão oficial (link "latest", chega pelo atualizador).
    # beta: versão de teste, sempre no mesmo link (release "teste"), fora do atualizador.
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes
        run: gradle testDebugUnitTest

      - name: Assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/corrida-verde.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/corrida-verde.p12" >> "$GITHUB_ENV"

      - name: APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk corrida-verde.apk

      - name: Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ github.event.head_commit.message || 'Build manual' }}
        run: |
          gh release create "v1.${{ github.run_number }}" corrida-verde.apk \
            --title "Corrida Verde 1.${{ github.run_number }}" \
            --notes "$NOTAS"

      - name: Versão de teste
        if: github.ref_name == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ github.event.head_commit.message || 'Build manual' }}
        run: |
          # A tag "teste" acompanha o último commit do beta; o APK é trocado no mesmo endereço.
          git tag -f teste
          git push -f origin teste
          gh release view teste >/dev/null 2>&1 || gh release create teste --prerelease --title "Versão de teste" --notes "Versão de teste"
          gh release upload teste corrida-verde.apk --clobber
          gh release edit teste --prerelease --title "Corrida Verde 1.${{ github.run_number }} (teste)" --notes "$NOTAS"
